<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- CSP：只允许本地 ws + 同源资源；inline style 给 system font fallback 留口。 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src ws://127.0.0.1:* ws://localhost:*; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>茶话室</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="status" class="status">连接中…</div>
  <div id="main">
    <aside id="sidebar" aria-label="房间成员">
      <div class="sidebar-section">
        <div class="sidebar-title">房间</div>
        <div id="room-name" class="sidebar-room-name">—</div>
        <div id="room-topic" class="sidebar-room-topic"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">茶客</div>
        <ul id="guests"></ul>
      </div>
    </aside>
    <ul id="messages" aria-live="polite"></ul>
  </div>
  <form id="composer">
    <div id="composer-wrap">
      <input id="text" type="text" placeholder="说点什么…  (@ 茶客名 直接点)" autocomplete="off" autofocus>
      <ul id="mention-dropdown" class="mention-dropdown" hidden></ul>
    </div>
    <button type="submit">发送</button>
  </form>
  <script type="module" src="renderer.js"></script>
</body>
</html>
