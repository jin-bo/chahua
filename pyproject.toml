[project]
name = "chahua"
version = "0.1.0"
description = "茶话室 —— 多 Agent 群聊桌面 App"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "agentao>=0.4.6",
    "python-dotenv>=1.0",
    "websockets>=13",
]

[project.scripts]
chahua = "chahua.cli:main"
chahua-server = "chahua.server:main"

[tool.hatch.build.targets.wheel]
packages = ["chahua"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
