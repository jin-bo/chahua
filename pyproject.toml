[project]
name = "chahua"
version = "0.1.11.dev0"
description = "茶话室 —— 多 Agent 群聊桌面 App"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "agentao>=0.4.18",
    "python-dotenv>=1.0",
    "websockets>=13",
]

[project.scripts]
chahua = "chahua.cli:main"
chahua-server = "chahua.server_entry:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["chahua"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
